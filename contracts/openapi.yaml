openapi: 3.1.0
info:
  title: Open Ecommerce — Reference Commerce Core Platform — aggregate contract
  version: 1.0.0
  description: >
    Aggregate view of the platform's public REST contracts. The normative per-service
    contracts are generated from code by Quarkus SmallRye OpenAPI at `/openapi` on each
    service; CI diffs them against this file (see docs/api/api-standards.md).
    Conventions: RFC 9457 errors, Idempotency-Key on creates, lifecycle transitions
    take no body, explicit units on every quantity, all data synthetic.
servers:
  - url: https://api.example.org/api/v1
    description: Production (per adopter)
security:
  - bearerAuth: []
paths:
  /storefronts:
    post:
      operationId: create-storefront
      summary: "Storefront registry: one front per market and currency."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /inventory:
    post:
      operationId: create-inventory
      summary: "Guarded inventory pools per SKU and the channel reservations against them."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /pricing-rules:
    post:
      operationId: create-pricing
      summary: "Decision rules binding customer segments to order-size and returns envelopes."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /products:
    post:
      operationId: create-product
      summary: "Product catalogue with minor-unit prices."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /notifications:
    post:
      operationId: dispatch-notification
      summary: Dispatch a notification
      responses:
        '202': { description: Accepted }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
